paper:
  title: "py-CIPro: Exact geometry of complete-intersection Calabi–Yau threefolds"
  date: "2026-11-18"
  cover:
    image: "cover/graphical-abstract.pdf"
    alt: "CICY3 records 7626 and 7635 share Hodge numbers (3, 47), Euler characteristic minus 88, and cubic and Chern gcds (2, 2, 2, 4). Their displayed configuration matrices give ambient index gcds of two and one. The first record has only even indices. The third hyperplane on the second record has index five. Across 7,868 non-product records, two gcds give 36 signatures, four give 50, and including the index gcd gives 51. Among 138 records with gcd greater than one, the counts for gcds 2, 3, 4, 5 and 8 are 120, 13, 2, 2 and 1."
