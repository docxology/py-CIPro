[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py-CIPro"
version = "0.2.0"
description = "Python interface to the upstream CIPro Wolfram Language package"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["wolframclient>=1.4.0,<2"]

[project.scripts]
py-cipro-dashboard = "py_cipro.dashboard:main"
py-cipro-qualify = "py_cipro.qualify:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_cipro*"]

[tool.setuptools.package-data]
py_cipro = ["vendor/CIProPackage.zip", "web/*.html", "web/*.css", "web/*.js"]
